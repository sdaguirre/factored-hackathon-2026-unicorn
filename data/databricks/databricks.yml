# Databricks Asset Bundle for the gold credit layer.
# Deploy:  databricks bundle deploy -t dev --profile <profile> --var="warehouse_id=<sql-warehouse-id>"
# Run:     databricks bundle run credit_gold_daily -t dev --profile <profile> --var="warehouse_id=<sql-warehouse-id>"
# The workspace comes from the CLI profile; no host or ids are stored in the repository.
bundle:
  name: credit-gold

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse that runs the SQL tasks (serverless recommended)

targets:
  # Development: resources are prefixed with "[dev <user>]", owned by the deploying user, and
  # schedules are paused automatically.
  dev:
    mode: development
    default: true

  # Production: unprefixed jobs under the deploying principal (restricted folder). Before the
  # first deploy, set run_as to a service principal and add failure notifications
  # (see data/databricks/README.md).
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
