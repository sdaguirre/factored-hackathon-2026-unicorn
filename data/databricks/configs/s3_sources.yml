# Configuration for copying LATAM Bank source CSVs from AWS S3 to Unity Catalog Landing Volume
s3_settings:
  bucket: "<s3-source-bucket>"
  region: us-east-2
  secret_scope: aws-datathon
  access_key_secret: aws-access-key-id
  secret_key_secret: aws-secret-access-key
  target_volume: workspace.staging_latam_bank.landing

sources:
  - table: branches
    prefix: data/branches.csv
    pattern: branches.csv

  - table: call_center_interactions
    prefix: data/call_center_interactions/
    pattern: "*.csv"

  - table: campaign_sends
    prefix: data/campaign_sends/
    pattern: "*.csv"

  - table: complaints
    prefix: data/complaints/
    pattern: "*.csv"

  - table: customers
    prefix: data/customers.csv
    pattern: customers.csv

  - table: daily_exchange_rates
    prefix: data/daily_exchange_rates.csv
    pattern: daily_exchange_rates.csv

  - table: marketing_campaigns
    prefix: data/marketing_campaigns.csv
    pattern: marketing_campaigns.csv

  - table: products
    prefix: data/products.csv
    pattern: products.csv

  - table: service_agents
    prefix: data/service_agents.csv
    pattern: service_agents.csv

  - table: transactions
    prefix: data/transactions/
    pattern: "*.csv"
