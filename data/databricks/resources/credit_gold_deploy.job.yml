resources:
  jobs:
    # Deploy-time objects: shared annuity functions and the credit_offers table. Run once per
    # deploy (manually); idempotent and never drops credit_offers.
    credit_gold_deploy:
      name: credit_gold_deploy
      description: Creates or updates the gold annuity functions and the credit_offers table.
      tags:
        project: credit-assistant
        layer: gold
      max_concurrent_runs: 1
      tasks:
        - task_key: gold_deploy_objects
          timeout_seconds: 900
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../gold/00_deploy_objects.sql
