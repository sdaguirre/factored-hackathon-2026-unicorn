resources:
  jobs:
    # Daily refresh of the indicators and offers the credit assistant reads.
    credit_gold_daily:
      name: credit_gold_daily
      description: >
        Rebuilds gold customer_credit_profile and customer_credit_offer_options from silver with
        the credit policy in silver ref_*, then runs quality checks that fail the job on bad data.
        Synthetic policy; see docs/CREDIT_RULES.md.
      tags:
        project: credit-assistant
        layer: gold
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        # YYYY-MM-DD. Empty uses the policy cutoff in ref_policy_params (2026-06-30 for the static
        # hackathon data). With live data set the default to "{{job.start_time.iso_date}}".
        - name: as_of_date
          default: ""
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Bogota
        pause_status: PAUSED
      # Alternative to the schedule: run when the upstream ingestion updates silver.
      # trigger:
      #   pause_status: PAUSED
      #   table_update:
      #     table_names:
      #       - workspace.silver_latam_bank.customers
      #       - workspace.silver_latam_bank.products
      tasks:
        - task_key: gold_customer_credit_profile
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 60000
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../gold/10_customer_credit_profile.sql
            parameters:
              as_of_date: "{{job.parameters.as_of_date}}"

        - task_key: gold_customer_credit_offer_options
          depends_on:
            - task_key: gold_customer_credit_profile
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 60000
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../gold/20_customer_credit_offer_options.sql

        - task_key: gold_quality_checks
          depends_on:
            - task_key: gold_customer_credit_offer_options
          timeout_seconds: 900
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../gold/90_quality_checks.sql
